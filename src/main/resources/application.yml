spring:
  application:
    name: betterreads

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:betterreads}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_APP_USERNAME:betterreads_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:betterreads}?sslmode=${DB_SSL_MODE:disable}
    user: ${DB_USERNAME:betterreads}
    password: ${DB_PASSWORD}
    target: ${SPRING_FLYWAY_TARGET:latest}
    placeholders:
      appPassword: ${DB_APP_PASSWORD}

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: ${SERVER_TOMCAT_ACCESSLOG_ENABLED:true}
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      pattern: '%{X-Forwarded-For}i %t "%r" %s %b %D "%{Referer}i" "%{User-Agent}i"'

management:
  server:
    port: 8081
    address: 127.0.0.1
    tomcat:
      accesslog:
        prefix: ""
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: betterreads
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:betterreads}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  session-expiration-hours: ${JWT_SESSION_EXPIRATION_HOURS:24}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

cloudflare:
  access:
    aud: ${CLOUDFLARE_ACCESS_AUD:}
    team-domain: ${CLOUDFLARE_TEAM_DOMAIN:}

mail:
  provider: ${MAIL_PROVIDER:logging}
  api-key: ${RESEND_API_KEY:}
  from: ${MAIL_FROM:}
  app-base-url: ${APP_BASE_URL:}
  outbox:
    worker-enabled: ${MAIL_OUTBOX_WORKER_ENABLED:true}
    claim-batch-size: 10
    max-attempts: 3
    lease-seconds: 300

auth:
  refresh-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
  rate-limit:
    login-capacity: 10
    login-refill-tokens: 1
    login-refill-seconds: 6
    register-capacity: 5
    register-refill-tokens: 1
    register-refill-seconds: 60
    forgot-password-capacity: 3
    forgot-password-refill-tokens: 1
    forgot-password-refill-seconds: 300
    reset-password-capacity: 5
    reset-password-refill-tokens: 1
    reset-password-refill-seconds: 60
    verify-email-capacity: 5
    verify-email-refill-tokens: 1
    verify-email-refill-seconds: 60
    resend-verification-capacity: 3
    resend-verification-refill-tokens: 1
    resend-verification-refill-seconds: 300
    change-password-capacity: 5
    change-password-refill-tokens: 1
    change-password-refill-seconds: 60
    search-capacity: 30
    search-refill-tokens: 10
    search-refill-seconds: 10
    event-stream-capacity: 10
    event-stream-refill-tokens: 1
    event-stream-refill-seconds: 30
    image-capacity: 60
    image-refill-tokens: 20
    image-refill-seconds: 10
    bucket-ttl-seconds: 900
    trusted-proxies: ${AUTH_TRUSTED_PROXIES:}

betterreads:
  auth:
    deletion:
      grace-period-hours: ${AUTH_DELETION_GRACE_PERIOD_HOURS:720}
      scheduler-enabled: ${AUTH_DELETION_SCHEDULER_ENABLED:true}
  catalog:
    staging:
      poll-enabled: ${CATALOG_STAGING_POLL_ENABLED:true}
    refresh:
      authors-enabled: ${CATALOG_REFRESH_AUTHORS_ENABLED:false}
      series-enabled: ${CATALOG_REFRESH_SERIES_ENABLED:false}
      max-books-per-run: ${CATALOG_REFRESH_MAX_BOOKS:50}
    description-backfill:
      enabled: ${CATALOG_DESCRIPTION_BACKFILL_ENABLED:true}
      full-sweep: ${CATALOG_DESCRIPTION_FULL_SWEEP:false}
    credit-backfill:
      enabled: ${CATALOG_CREDIT_BACKFILL_ENABLED:false}
      slice-size: ${CATALOG_CREDIT_BACKFILL_SLICE_SIZE:50}
      cron: ${CATALOG_CREDIT_BACKFILL_CRON:0 * * * * *}
      pause: ${CATALOG_CREDIT_BACKFILL_PAUSE:1s}
    cover-backfill:
      enabled: ${CATALOG_COVER_BACKFILL_ENABLED:true}
      full-sweep: ${CATALOG_COVER_FULL_SWEEP:false}
    metadata-check:
      enabled: ${CATALOG_METADATA_CHECK_ENABLED:false}
      batch-size: ${CATALOG_METADATA_CHECK_BATCH_SIZE:10}
      max-books-per-run: ${CATALOG_METADATA_CHECK_MAX_BOOKS:100}
      retry-after-failure: ${CATALOG_METADATA_CHECK_RETRY_AFTER_FAILURE:P1D}
      retry-after-unconfirmed: ${CATALOG_METADATA_CHECK_RETRY_AFTER_UNCONFIRMED:P7D}
      max-attempts: ${CATALOG_METADATA_CHECK_MAX_ATTEMPTS:3}
      check-version: 2
  cache:
    book-detail-ttl: ${BOOK_DETAIL_CACHE_TTL:PT24H}
  search:
    author-reconcile-cron: ${SEARCH_AUTHOR_RECONCILE_CRON:0 40 3 * * *}

openlibrary:
  base-url: ${OPENLIBRARY_BASE_URL:https://openlibrary.org}
  contact-email: ${OPENLIBRARY_CONTACT_EMAIL:contact@betterreadsapp.com}
  connect-timeout: ${OPENLIBRARY_CONNECT_TIMEOUT:5000}
  read-timeout: ${OPENLIBRARY_READ_TIMEOUT:10000}

googlebooks:
  base-url: ${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
  api-key: ${GOOGLE_BOOKS_API_KEY:}
  connect-timeout: ${GOOGLE_BOOKS_CONNECT_TIMEOUT:5000}
  read-timeout: ${GOOGLE_BOOKS_READ_TIMEOUT:10000}

hardcover:
  base-url: ${HARDCOVER_BASE_URL:https://api.hardcover.app/v1/graphql}
  bearer-token: ${HARDCOVER_BEARER_TOKEN:}
  connect-timeout: ${HARDCOVER_CONNECT_TIMEOUT:5000}
  read-timeout: ${HARDCOVER_READ_TIMEOUT:10000}

loc:
  base-url: ${LOC_BASE_URL:http://lx2.loc.gov:210/lcdb}
  connect-timeout: ${LOC_CONNECT_TIMEOUT:5000}
  read-timeout: ${LOC_READ_TIMEOUT:10000}

wikidata:
  base-url: ${WIKIDATA_BASE_URL:https://www.wikidata.org}
  connect-timeout: ${WIKIDATA_CONNECT_TIMEOUT:5000}
  read-timeout: ${WIKIDATA_READ_TIMEOUT:10000}

web-search:
  bin: ${WEB_SEARCH_BIN:claude}
  model: ${WEB_SEARCH_MODEL:claude-sonnet-5-5}
  effort: ${WEB_SEARCH_EFFORT:medium}
  max-turns: ${WEB_SEARCH_MAX_TURNS:80}
  timeout: ${WEB_SEARCH_TIMEOUT:PT10M}
  hook-script: ${WEB_SEARCH_HOOK_SCRIPT:/opt/websearch/restrict-search.mjs}
  group-domains:
    "[SFF]":
      - isfdb.org
      - bookseriesinorder.com
      - baen.com
      - store.gollancz.co.uk
    "[COMIC]":
      - idwpublishing.com
      - viz.com
      - yenpress.com
      - abramsbooks.com
    "[YOUNG_ADULT]":
      - scholastic.com
      - abramsbooks.com
      - bookseriesinorder.com
    "[GENERAL]":
      - bookseriesinorder.com
      - abramsbooks.com
      - kensingtonbooks.com
  shared-domains:
    - en.wikipedia.org
    - openlibrary.org
    - books.google.com
    - goodreads.com
    - fictiondb.com
    - kirkusreviews.com
    - isbnsearch.org
    - barnesandnoble.com
    - thriftbooks.com
    - books.apple.com
    - target.com
    - indigo.ca
    - penguinrandomhouse.com
    - penguin.co.uk
    - us.macmillan.com
    - panmacmillan.com
    - hachettebookgroup.com
    - headline.co.uk
    - littlebrown.co.uk
  search-only-domains:
    - isfdb.org
  page-connect-timeout: ${WEB_SEARCH_PAGE_CONNECT_TIMEOUT:5000}
  page-read-timeout: ${WEB_SEARCH_PAGE_READ_TIMEOUT:15000}
  page-max-bytes: ${WEB_SEARCH_PAGE_MAX_BYTES:2097152}
  page-schemes:
    - https

wikipedia:
  base-url: ${WIKIPEDIA_BASE_URL:https://en.wikipedia.org}
  connect-timeout: ${WIKIPEDIA_CONNECT_TIMEOUT:5000}
  read-timeout: ${WIKIPEDIA_READ_TIMEOUT:10000}

itunes:
  base-url: ${ITUNES_BASE_URL:https://itunes.apple.com}
  connect-timeout: ${ITUNES_CONNECT_TIMEOUT:5000}
  read-timeout: ${ITUNES_READ_TIMEOUT:10000}
  rate-per-minute: ${ITUNES_RATE_PER_MINUTE:12}

meilisearch:
  host: ${MEILISEARCH_HOST:http://localhost:7700}
  master-key: ${MEILI_MASTER_KEY}
  index-name: ${MEILISEARCH_INDEX_NAME:books}
  authors-index-name: ${MEILISEARCH_AUTHORS_INDEX_NAME:authors}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket: ${MINIO_BUCKET:betterreads-images}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

cover-fetch:
  connect-timeout: ${COVER_FETCH_CONNECT_TIMEOUT:5000}
  read-timeout: ${COVER_FETCH_READ_TIMEOUT:10000}
  max-bytes: ${COVER_FETCH_MAX_BYTES:16777216}

images:
  public-base-url: ${IMAGES_PUBLIC_BASE_URL:${SPRINGDOC_PUBLIC_URL:http://localhost:8080}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  public-url: ${SPRINGDOC_PUBLIC_URL:http://localhost:8080}

logging:
  level:
    com.betterreads: INFO
    org.springframework.security: WARN
    org.springdoc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
