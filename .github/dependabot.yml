version: 2
registries:
  maven-central:
    type: maven-repository
    url: https://repo.maven.apache.org/maven2
    replaces-base: true
  gradle-plugin-portal:
    type: maven-repository
    url: https://plugins.gradle.org/m2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-central
      - gradle-plugin-portal
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
