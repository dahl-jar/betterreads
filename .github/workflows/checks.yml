name: Checks

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: JUnit and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test container images
        run: bash .github/scripts/pull-test-images.sh

      - name: Run tests and verify coverage
        run: ./gradlew testJob --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/html/
          retention-days: 14

      - name: Upload JaCoCo XML for coverage tools
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 14

  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile and run static analysis
        run: ./gradlew lint --continue

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-analysis-reports
          path: |
            build/reports/checkstyle/
            build/reports/pmd/
            build/reports/spotbugs/
          retention-days: 14

  full:
    name: Full check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run remaining check tasks
        run: ./gradlew extraChecks --continue

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build application JAR
        run: ./gradlew bootJar

      - name: Scan dependencies
        continue-on-error: true
        run: docker run --rm -v "$PWD/build/libs:/scan:ro" aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 /scan

  deploy:
    name: Deploy
    needs: [tests, quality, full, dependencies]
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Assume the deploy request role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Send the deploy request
        run: |
          set -euo pipefail
          queue_url="$(aws ssm get-parameter --name /homelab/deploy/queue-url --query Parameter.Value --output text)"
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" '{repo:$repo,ref:$ref,sha:$sha}')"
          aws sqs send-message --queue-url "$queue_url" --message-body "$body" > /dev/null
