name: CI

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  jenkins:
    name: Jenkins
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: jenkins-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
    steps:
      - name: Assume the deploy request role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Send the test request
        env:
          QUEUE_URL: ${{ vars.DEPLOY_QUEUE_URL }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          KIND: test
        run: |
          set -euo pipefail
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg ref "$REF" --arg sha "$SHA" --arg kind "$KIND" '{repo:$repo,ref:$ref,sha:$sha,kind:$kind}')"
          message_id="$(aws sqs send-message --queue-url "$QUEUE_URL" --message-body "$body" --query MessageId --output text)"
          printf '%s\n\n%s\n' "Sent \`$body\`" "MessageId \`$message_id\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy Dev | Jenkins
    if: ${{ !github.event.deleted && contains(fromJSON('["main"]'), github.ref_name) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: deploy-dev-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Assume the deploy request role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Send the deploy request
        env:
          QUEUE_URL: ${{ vars.DEPLOY_QUEUE_URL }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          KIND: deploy
        run: |
          set -euo pipefail
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg ref "$REF" --arg sha "$SHA" --arg kind "$KIND" '{repo:$repo,ref:$ref,sha:$sha,kind:$kind}')"
          message_id="$(aws sqs send-message --queue-url "$QUEUE_URL" --message-body "$body" --query MessageId --output text)"
          printf '%s\n\n%s\n' "Sent \`$body\`" "MessageId \`$message_id\`" >> "$GITHUB_STEP_SUMMARY"
