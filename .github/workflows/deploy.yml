name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

permissions: {}

jobs:
  deploy:
    name: Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Assume the deploy request role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Send the deploy request
        env:
          QUEUE_URL: ${{ vars.DEPLOY_QUEUE_URL }}
          REF: refs/heads/${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg ref "$REF" --arg sha "$SHA" '{repo:$repo,ref:$ref,sha:$sha}')"
          aws sqs send-message --queue-url "$QUEUE_URL" --message-body "$body" > /dev/null
